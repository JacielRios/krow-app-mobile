apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Native SDK credentials can come from CI or the developer's ignored local.properties.
def localMapsProperties = new Properties()
def localMapsFile = rootProject.file("local.properties")
if (localMapsFile.exists()) localMapsFile.withInputStream { localMapsProperties.load(it) }
def nativeMapsKey = (System.getenv("KROW_ANDROID_MAPS_API_KEY") ?: localMapsProperties.getProperty("KROW_ANDROID_MAPS_API_KEY", "")).trim()
// Compatibility for existing local development setups only. Never used by release.
def debugMapsKey = nativeMapsKey ?: (project.env.get("GOOGLE_MAPS_API_KEY") ?: "").trim()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.krownmobileapp"
    defaultConfig {
        applicationId "com.krownmobileapp"
        // La clave del SDK nativo se inyecta al compilar, fuera de
        // react-native-config y del bundle JavaScript.
        resValue "string", "google_maps_android_sdk_key", nativeMapsKey
        resValue "string", "krow_firebase_app_id", System.getenv("KROW_FIREBASE_APP_ID") ?: ""
        resValue "string", "krow_firebase_api_key", System.getenv("KROW_FIREBASE_API_KEY") ?: ""
        resValue "string", "krow_firebase_project_id", System.getenv("KROW_FIREBASE_PROJECT_ID") ?: ""
        resValue "string", "krow_firebase_sender_id", System.getenv("KROW_FIREBASE_SENDER_ID") ?: ""
        resValue "string", "krow_link_origin", System.getenv("KROW_LINK_ORIGIN") ?: ""
        manifestPlaceholders.krowLinkHost = System.getenv("KROW_LINK_ORIGIN") ? new URI(System.getenv("KROW_LINK_ORIGIN")).host : "links.invalid"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((System.getenv("KROW_VERSION_CODE") ?: "2").toInteger())
        versionName System.getenv("KROW_VERSION_NAME") ?: "0.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KROW_RELEASE_STORE_FILE") ?: "release.keystore")
            storePassword System.getenv("KROW_RELEASE_STORE_PASSWORD")
            keyAlias System.getenv("KROW_RELEASE_KEY_ALIAS")
            keyPassword System.getenv("KROW_RELEASE_KEY_PASSWORD")
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            resValue "string", "google_maps_android_sdk_key", debugMapsKey
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
        // Installable private test build: bundled JS and no Metro dependency.
        // Keep production release signing and its validation independent.
        trial {
            initWith release
            // React Native sets this for its built-in variants only.
            manifestPlaceholders.usesCleartextTraffic = "false"
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            versionNameSuffix "-trial"
            debuggable false
        }
    }
}

// Private pilot updates share the existing package/certificate. Keep production
// versioning controlled by KROW_VERSION_* independently of this test variant.
androidComponents {
    onVariants(selector().withBuildType("trial")) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(4)
            output.versionName.set("0.2.2-trial")
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.mapbox.navigationcore:android-ndk27:3.23.0")
    implementation("com.google.firebase:firebase-messaging:25.1.3")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

// A missing native key otherwise produces an empty map only after installation.
def validateReleaseMapsConfiguration = tasks.register("validateReleaseMapsConfiguration") {
    doLast {
        if (["KROW_RELEASE_STORE_FILE", "KROW_RELEASE_STORE_PASSWORD", "KROW_RELEASE_KEY_ALIAS", "KROW_RELEASE_KEY_PASSWORD"].any { !System.getenv(it) }) {
            throw new GradleException("Release requires the KROW_RELEASE_* signing credentials. Debug signing is never used for release.")
        }
        if (!nativeMapsKey) {
            throw new GradleException("KROW_ANDROID_MAPS_API_KEY is required for release. Supply an Android SDK key restricted to this application's package and signing certificate; do not use the backend REST key.")
        }
    }
}
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn(validateReleaseMapsConfiguration)
}

def validateTrialConfiguration = tasks.register("validateTrialConfiguration") {
    doLast {
        if (!nativeMapsKey) {
            throw new GradleException("Trial requires KROW_ANDROID_MAPS_API_KEY. Prefer an Android SDK key restricted to com.krownmobileapp and the debug certificate.")
        }
        def api = (project.env.get("KROW_API_URL") ?: "").trim()
        def apiUri = api ? new URI(api) : null
        if (!apiUri || apiUri.scheme != "https" || !apiUri.host || apiUri.host in ["localhost", "127.0.0.1", "10.0.2.2"]) {
            throw new GradleException("Trial requires a deployed HTTPS KROW_API_URL in the mobile environment file.")
        }
        if (!(project.env.get("SUPABASE_URL") ?: "").startsWith("https://") || !(project.env.get("SUPABASE_ANON_KEY") ?: "").trim()) {
            throw new GradleException("Trial requires the project's public Supabase URL and anon/publishable key.")
        }
    }
}
tasks.matching { it.name == "preTrialBuild" }.configureEach {
    dependsOn(validateTrialConfiguration)
}
